<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Studenți pentru totdeauna · Studentify</title>
<!-- Studentify brand: Poppins only; colours from GHID DE IDENTITATE STUDENTIFY -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lochmara:#037AC7;   /* primary */
  --supernova:#FFCF01;  /* primary */
  --treepoppy:#F7941D;  /* primary */
  --aquaforest:#569374; /* primary */
  --viking:#7BC7DB;     /* secondary */
  --illusion:#F6B1CF;   /* secondary */
  --apricot:#FDD5C0;    /* secondary */
  --persimmon:#FF7352;  /* secondary */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--lochmara);
  font-family:'Poppins',sans-serif;color:#fff}
/* flat geometric shapes */
.c1{position:absolute;width:520px;height:520px;border-radius:50%;background:var(--supernova);right:-170px;top:-190px}
.c2{position:absolute;width:300px;height:300px;border-radius:50%;background:var(--viking);left:-120px;bottom:210px}
.c3{position:absolute;width:150px;height:150px;border-radius:50%;background:var(--treepoppy);right:70px;bottom:250px}

.logo{position:absolute;top:64px;left:72px;font-weight:700;font-size:44px;letter-spacing:-.02em;color:#fff}
.handle{position:absolute;top:80px;right:84px;font-weight:600;font-size:24px;color:var(--lochmara)}

.kicker{position:absolute;top:190px;left:72px;font-weight:600;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--supernova)}
h1{position:absolute;top:236px;left:68px;font-weight:800;font-size:104px;line-height:1;letter-spacing:-.035em}
h1 .hl{background:var(--supernova);color:var(--lochmara);padding:0 18px;border-radius:20px;display:inline-block;margin-top:10px}

.photo{position:absolute;left:72px;top:500px;width:600px;height:690px;border-radius:40px;overflow:hidden;border:10px solid #fff}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 72%}

.facts{position:absolute;left:712px;top:530px;width:300px;display:flex;flex-direction:column;gap:22px}
.fact{background:#fff;color:#1d1d1b;border-radius:28px;padding:22px 26px}
.fact small{display:block;font-weight:500;font-size:20px;color:#6b6b6b}
.fact b{display:block;font-weight:700;font-size:30px;line-height:1.2}
.fact.y{background:var(--supernova)}
.fact.g{background:var(--aquaforest);color:#fff}.fact.g small{color:rgba(255,255,255,.8)}

.bar{position:absolute;left:0;right:0;bottom:0;height:120px;background:#fff;color:var(--lochmara);
  display:flex;align-items:center;justify-content:space-between;padding:0 72px}
.bar .pillars{font-weight:700;font-size:30px}
.bar .pillars span{color:var(--treepoppy)}
.bar .ref{font-weight:600;font-size:22px;color:#6b6b6b}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="c1"></div><div class="c2"></div><div class="c3"></div>

  <!-- TODO: înlocuiește cu sigla oficială studentify (versiunea albă, fără efecte) -->
  <div class="logo">studentify</div>
  <div class="handle">@studentify.md</div>

  <div class="kicker">Echipa noastră</div>
  <h1>Studenți<br><span class="hl">pentru totdeauna</span></h1>

  <div class="photo"><img src="../img/eternal_students.jpg" alt=""></div>

  <div class="facts">
    <div class="fact"><small>Sesiunea</small><b>închisă ✓</b></div>
    <div class="fact y"><small>Diploma</small><b>luată ✓</b></div>
    <div class="fact g"><small>Campusul</small><b>nu ne lasă 😄</b></div>
  </div>

  <div class="bar">
    <div class="pillars">Mentorare <span>•</span> Dezvoltare <span>•</span> Comunitate</div>
    <div class="ref">2 Timotei 2:2</div>
  </div>
</div>
</body>
</html>
